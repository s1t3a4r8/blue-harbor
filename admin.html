<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>관리자 | Blue Harbor</title><link rel="stylesheet" href="style.css"></head>
<body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">B</span><span>BLUE HARBOR<small>ADMIN CONSOLE</small></span></a><a class="admin-link" href="index.html">홈으로</a></header>
<main class="section" style="min-height:75vh">
  <div class="eyebrow">PRIVATE ACCESS</div><h2>관리자 로그인</h2><p class="muted">승인된 관리자 계정으로 로그인하세요.</p>
  <section class="panel" style="max-width:760px">
    <form id="loginForm" class="request-form" style="padding:0;border:0;background:transparent">
      <label>이메일<input type="email" id="email" required autocomplete="username" placeholder="관리자 이메일"></label>
      <label>비밀번호<input type="password" id="password" required autocomplete="current-password" placeholder="비밀번호"></label>
      <button class="btn primary" type="submit">로그인</button><p class="form-status" id="loginStatus"></p>
    </form>
    <div id="dashboard" hidden>
      <div class="panel-top" style="margin-top:25px"><span>INBOX</span><button class="btn ghost" id="logoutBtn" type="button">로그아웃</button></div>
      <h3>접수 내역</h3><p class="muted small">처리 상태를 확인하고 필요한 경우 내용을 검토하세요.</p>
      <div id="requestList" class="muted small">불러오는 중...</div>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script>
</body></html>
